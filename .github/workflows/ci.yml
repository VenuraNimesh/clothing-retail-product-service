name: Clothing Retail Product Service - CI/CD

on:
  push:
    branches:
      - development
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  # Job 1: Build application and run tests
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B clean verify


  # Job 2: Build Docker image and publish to ECR
  publish-to-ecr:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: build-and-test

    # Publish only after a successful push to master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            691993442626.dkr.ecr.ap-southeast-2.amazonaws.com/clothing-retail-product-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
